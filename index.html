<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>転生したら落ちゲーの中でした。Prototype v78</title><link rel="stylesheet" href="style.css">
<script>
window.pendingClass=null;
window.CLASS_HELP_SAFE={
 hero:"勇者｜剣：上下左右攻撃／跳：ジャンプ／掴：掴み・長押し色変更／蹴：最大2段押し／チャージ：赤全消去",
 monk:"モンク｜拳：横ダルマ落とし・上アッパー・下破壊／二段：2段ジャンプ／持：持ち運び／蹴：吹き飛ばし／チャージ：緑全消去",
 mage:"魔法使い｜常時浮遊／炎：ファイアボール／氷：アイスショット／風替：上下交換／風押：スライムを横へ押す／チャージ：青全消去＋解凍"
};
window.selectJob=function(job,el){
 window.pendingClass=job;
 document.querySelectorAll("#classSelect .classBtn[data-class]").forEach(function(x){x.classList.toggle("selected",x===el);});
 var help=document.getElementById("classHelp"),start=document.getElementById("startBtn");
 if(help)help.textContent=window.CLASS_HELP_SAFE[job]||"";
 if(start)start.disabled=false;
};
window.startBossOnly=function(){
 if(!window.pendingClass){var h=document.getElementById("classHelp");if(h)h.textContent="先に職業を選んでください。";return}
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
 if(typeof window.beginBossOnly==="function")window.beginBossOnly(window.pendingClass);
};
try{if(localStorage.getItem("osekkaiBossUnlocked")==="1")window.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("bossOnlyBtn");if(b)b.style.display="block"})}catch(e){}
window.openGameSettings=function(){var s=window.getGameSettings?window.getGameSettings():{crushGameOver:false,bats:true,skeletons:true};setCrush.checked=!!s.crushGameOver;setBats.checked=s.bats!==false;setSkeletons.checked=s.skeletons!==false;settingsPanel.style.display="flex"};
window.closeGameSettings=function(){if(window.setGameSetting){window.setGameSetting("crushGameOver",setCrush.checked);window.setGameSetting("bats",setBats.checked);window.setGameSetting("skeletons",setSkeletons.checked)}settingsPanel.style.display="none"};
window.startSelectedMode=function(mode){
 var chosen=document.querySelector("#classSelect .classBtn[data-class].selected");
 if(!chosen){var h=document.getElementById("classHelp");if(h)h.textContent="先に職業を選んでください。";return}
 var job=chosen.getAttribute("data-class");
 if(typeof window.beginSpecialMode!=="function")return;
 window.beginSpecialMode(job,mode);
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
};
window.startSelectedJob=function(){
 var chosen=document.querySelector("#classSelect .classBtn[data-class].selected");
 if(!chosen)return;
 var job=chosen.getAttribute("data-class");
 if(typeof window.beginSelectedJob!=="function")return;
 window.beginSelectedJob(job);
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
};
</script></head>
<body><button type="button" onclick="openGameSettings()" style="position:fixed;right:10px;top:72px;z-index:70">⚙ 設定</button>
<div id="settingsPanel" style="display:none;position:fixed;inset:0;z-index:90;background:rgba(10,20,38,.9);align-items:center;justify-content:center;padding:20px"><div style="max-width:420px;width:100%;background:#263d5c;border:2px solid #91b7dc;border-radius:18px;padding:20px;color:white">
<h2>ゲーム設定</h2>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>シビアな押し潰し</b><br><small>OFF：にゅるっと脱出（デフォルト）<br>ON：下敷きでゲームオーバー</small></span><input id="setCrush" type="checkbox"></label>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>使い魔</b><br><small>出現する／しない</small></span><input id="setBats" type="checkbox"></label>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>スケルトン</b><br><small>出現する／しない</small></span><input id="setSkeletons" type="checkbox"></label>
<button type="button" onclick="closeGameSettings()" style="width:100%;padding:12px">保存して閉じる</button></div></div><div id="classSelect" class="overlay"><div class="panel"><h2>職業を選択</h2>
<button type="button" data-class="hero" class="classBtn" onclick="selectJob('hero',this)">⚔️ 勇者<small>タップで操作説明</small></button>
<button type="button" data-class="monk" class="classBtn" onclick="selectJob('monk',this)">👊 モンク<small>タップで操作説明</small></button>
<button type="button" data-class="mage" class="classBtn" onclick="selectJob('mage',this)">🪄 魔法使い<small>タップで操作説明</small></button>
<div id="classHelp" class="classHelp">職業をタップすると操作説明が表示されます。</div>
<button type="button" id="startBtn" class="startBtn" onclick="startSelectedJob()" disabled>この職業で開始</button>
<button type="button" class="classBtn" onclick="startSelectedMode('timeAttack')">⏱ タイムアタック<small>連鎖P 20までのタイム勝負</small></button>
<button type="button" class="classBtn" onclick="startSelectedMode('endless')">♾ ひたすらモード<small>クリアなし・好きな時に離脱</small></button>
<button type="button" id="bossOnlyBtn" class="classBtn bossOnlyBtn" style="display:none" onclick="startBossOnly()">👑 ボス戦だけ遊ぶ<small>一度戦ったボスへ直接挑戦</small></button>
</div></div><div id="stageMenu" class="overlay stageMenu" style="display:none"><div class="panel">
<h2 id="stageResult">STAGE CLEAR!</h2>
<p id="stageInfo">次は少し難しくなります。</p>
<button id="nextStageBtn" class="startBtn">次のステージへ</button>
<button id="continueBtn" class="startBtn" style="display:none">コンティニュー</button>
<button id="titleBtn" class="classBtn">タイトルへ戻る</button>
</div></div><main>
<div class="title">転生したら落ちゲーの中でした。<small>おせっかい勇者 Prototype v78</small></div>
<div class="hud"><span>STAGE <b id="stageText">1</b></span><span>連鎖P <b id="chainPoints">0</b>/<b id="goalPoints">12</b></span><span>SCORE <b id="score">0</b></span><span>必殺 <b id="specialText">0%</b></span><span id="bossHud" style="display:none">BOSS <b id="bossHpText">30</b></span><span id="bossHpGauge" style="display:inline-block;width:110px;height:9px;background:#2a2638;border-radius:8px;overflow:hidden;vertical-align:middle;margin-left:4px"><span id="bossHpBar" style="display:block;width:100%;height:100%;background:#e76565"></span></span><span id="modeText"></span><span id="modeTime"></span><button id="modeExitBtn" style="display:none">離脱</button></div>
<div class="gauge"><div id="specialBar"></div></div>
<canvas id="game" width="360" height="630"></canvas><div id="message"></div>
<div class="controls">
 <div class="dpad stick" id="moveStick"><div class="stickRing"><div class="stickKnob" id="stickKnob"></div></div></div><button id="fastFall" class="fastFall" aria-label="早送り落下">▼▼<small>早送り</small></button>
 <div class="actions"><button data-key="grab">掴</button><button data-key="jump">跳</button><button data-key="attack">剣</button><button data-key="kick" class="kick">蹴</button></div>
</div>
<p id="className">職業: -</p><p class="help">方向キー＋攻撃 / 跳 / 攻撃長押し=チャージ必殺 / 魔法使い: 剣=炎・蹴=氷・掴=風・跳=浮遊</p>
<script src="game.js?v=78"></script></main></body></html>
<style>#specialBar{max-width:100%} .specialMeter,.specialWrap{max-width:46%;}</style>
