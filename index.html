<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>転生したら落ちゲーの中でした。Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="title">転生したら落ちゲーの中でした。<small>おせっかい勇者 Prototype</small></div>
    <div class="hud">
      <span>CHAIN <b id="chain">0</b></span>
      <span>SCORE <b id="score">0</b></span>
      <span>必殺 <b id="specialText">0%</b></span>
    </div>
    <div class="gauge"><div id="specialBar"></div></div>
    <canvas id="game" width="360" height="640"></canvas>
    <div id="message"></div>
    <div class="controls">
      <div class="dpad">
        <button data-key="left">◀</button><button data-key="right">▶</button>
      </div>
      <div class="actions">
        <button data-key="grab">掴</button>
        <button data-key="jump">跳</button>
        <button data-key="attack">剣</button>
        <button data-key="special" class="special">必殺</button>
      </div>
    </div>
    <p class="help">PC: ←→ 移動 / Z ジャンプ / X 剣(長押しチャージ) / C 掴む / V 必殺 / ↑↓+X 方向斬り</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
