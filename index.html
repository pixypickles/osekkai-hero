<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>転生したら落ちゲーの中でした。Prototype v98</title><link rel="stylesheet" href="style.css?v=98">
<script>
window.pendingClass=null;
window.CLASS_HELP_SAFE={
 hero:"勇者｜剣：上下左右攻撃／跳：ジャンプ／掴：掴み・長押し色変更／蹴：最大2段押し／チャージ：赤全消去",
 monk:"モンク｜拳：横ダルマ落とし・上アッパー・下破壊／二段：2段ジャンプ／持：持ち運び／蹴：吹き飛ばし／チャージ：緑全消去",
 mage:"魔法使い｜常時浮遊／炎：ファイアボール／氷：アイスショット／風替：上下交換／風押：スライムを横へ押す／チャージ：青全消去＋解凍"
};
window.selectJob=function(job,el){
 window.pendingClass=job;
 document.querySelectorAll("#classSelect .classBtn[data-class]").forEach(function(x){x.classList.toggle("selected",x===el);});
 var help=document.getElementById("classHelp"),start=document.getElementById("startBtn");
 if(help)help.textContent=window.CLASS_HELP_SAFE[job]||"";
 if(start)start.disabled=false;
};
window.startBossOnly=function(){
 if(!window.pendingClass){var h=document.getElementById("classHelp");if(h)h.textContent="先に職業を選んでください。";return}
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
 if(typeof window.beginBossOnly==="function")window.beginBossOnly(window.pendingClass);
};
try{if(localStorage.getItem("osekkaiBossUnlocked")==="1")window.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("bossOnlyBtn");if(b)b.style.display="block"})}catch(e){}
window.openGameSettings=function(){var s=window.getGameSettings?window.getGameSettings():{crushGameOver:false,bats:true,skeletons:true};setCrush.checked=!!s.crushGameOver;setBats.checked=s.bats!==false;setSkeletons.checked=s.skeletons!==false;settingsPanel.style.display="flex"};
window.closeGameSettings=function(){if(window.setGameSetting){window.setGameSetting("crushGameOver",setCrush.checked);window.setGameSetting("bats",setBats.checked);window.setGameSetting("skeletons",setSkeletons.checked)}settingsPanel.style.display="none"};
window.startSelectedMode=function(mode){
 var chosen=document.querySelector("#classSelect .classBtn[data-class].selected");
 if(!chosen){var h=document.getElementById("classHelp");if(h)h.textContent="先に職業を選んでください。";return}
 var job=chosen.getAttribute("data-class");
 if(mode==="cloud"){
   if(job==="mage"){var h=document.getElementById("classHelp");if(h)h.textContent="☁ 雲登りは勇者・モンク専用です。";return}
   if(typeof window.beginCloudMode==="function"){window.beginCloudMode(job)}
   else if(typeof window.beginSelectedJob==="function"){window.beginSelectedJob(job);setTimeout(function(){if(typeof window.startCloudClimb==="function")window.startCloudClimb()},0)}
 }else{
   if(typeof window.beginSpecialMode!=="function")return;
   window.beginSpecialMode(job,mode);
 }
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
};
window.startSelectedJob=function(){
 var chosen=document.querySelector("#classSelect .classBtn[data-class].selected");
 if(!chosen)return;
 var job=chosen.getAttribute("data-class");
 if(typeof window.beginSelectedJob!=="function")return;
 window.beginSelectedJob(job);
 var overlay=document.getElementById("classSelect");if(overlay)overlay.style.display="none";
};
</script></head>
<body><div id="gameFamilySelect" class="overlay familySelect"><div class="panel">
<h2>ゲームモード</h2><p class="familyLead">どっちの落ちゲーで遊ぶ？</p>
<div class="familyGrid">
<button type="button" class="familyBtn slimeFamily" onclick="chooseGameFamily('slime')"><b>🟢 スライムモード</b><small>おせっかい勇者／連鎖・雲登り・ボス戦</small></button>
<button type="button" class="familyBtn jewelFamily" onclick="chooseGameFamily('jewel')"><b>💎 宝石モード</b><small>3個1組の宝石を揃えるコラムス</small></button>
</div></div></div>
<div id="columnsScreen" style="display:none">
 <div class="columnsTop"><b>💎 宝石コラムス</b><span>SCORE <strong id="columnsScore">0</strong></span><span>CHAIN <strong id="columnsChain">0</strong></span><button type="button" onclick="columnsToTitle()">タイトル</button></div>
 <canvas id="columnsCanvas" width="360" height="630"></canvas>
 <div class="columnsControls"><button data-col="left">◀</button><button data-col="rotate">↻<small>並替</small></button><button data-col="right">▶</button><button data-col="down">▼<small>落下</small></button></div>
</div>
<script>
window.chooseGameFamily=function(mode){
 document.getElementById("gameFamilySelect").style.display="none";
 if(mode==="slime"){document.getElementById("classSelect").style.display="flex"}
 else {
 document.querySelector("main").style.display="none";
 document.getElementById("columnsScreen").style.display="flex";
 requestAnimationFrame(function(){window.startColumns()});
}
};
window.columnsToTitle=function(){location.reload()};
</script>
<button type="button" onclick="openGameSettings()" style="position:fixed;right:10px;top:72px;z-index:70">⚙ 設定</button>
<div id="settingsPanel" style="display:none;position:fixed;inset:0;z-index:90;background:rgba(10,20,38,.9);align-items:center;justify-content:center;padding:20px"><div style="max-width:420px;width:100%;background:#263d5c;border:2px solid #91b7dc;border-radius:18px;padding:20px;color:white">
<h2>ゲーム設定</h2>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>シビアな押し潰し</b><br><small>OFF：にゅるっと脱出（デフォルト）<br>ON：下敷きでゲームオーバー</small></span><input id="setCrush" type="checkbox"></label>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>使い魔</b><br><small>出現する／しない</small></span><input id="setBats" type="checkbox"></label>
<label style="display:flex;justify-content:space-between;margin:18px 0"><span><b>スケルトン</b><br><small>出現する／しない</small></span><input id="setSkeletons" type="checkbox"></label>
<button type="button" onclick="closeGameSettings()" style="width:100%;padding:12px">保存して閉じる</button></div></div><div id="classSelect" class="overlay" style="display:none"><div class="panel"><h2>職業を選択</h2>
<div class="jobRow">
<button type="button" data-class="hero" class="classBtn" onclick="selectJob('hero',this)">⚔️<b>勇者</b><small>操作説明</small></button>
<button type="button" data-class="monk" class="classBtn" onclick="selectJob('monk',this)">👊<b>モンク</b><small>操作説明</small></button>
<button type="button" data-class="mage" class="classBtn" onclick="selectJob('mage',this)">🪄<b>魔法使い</b><small>操作説明</small></button>
</div>
<div id="classHelp" class="classHelp">職業をタップすると操作説明が表示されます。</div>
<button type="button" id="startBtn" class="startBtn" onclick="startSelectedJob()" disabled>この職業で開始</button>
<button type="button" class="classBtn" onclick="startSelectedMode('timeAttack')">⏱ タイムアタック<small>連鎖P 20までのタイム勝負</small></button>
<button type="button" class="classBtn" onclick="startSelectedMode('endless')">♾ ひたすらモード<small>クリアなし・好きな時に離脱</small></button>
<button type="button" id="cloudClimbBtn" class="classBtn" onclick="startSelectedMode('cloud')">☁ 雲登り<small>勇者・モンク専用／雲を乗り継いで頂上へ</small></button>
<button type="button" id="bossOnlyBtn" class="classBtn bossOnlyBtn" style="display:none" onclick="startBossOnly()">👑 ボス戦だけ遊ぶ<small>一度戦ったボスへ直接挑戦</small></button>
</div></div><div id="stageMenu" class="overlay stageMenu" style="display:none"><div class="panel">
<h2 id="stageResult">STAGE CLEAR!</h2>
<p id="stageInfo">次は少し難しくなります。</p>
<button id="nextStageBtn" class="startBtn">次のステージへ</button>
<button id="continueBtn" class="startBtn" style="display:none">コンティニュー</button>
<button id="titleBtn" class="classBtn">タイトルへ戻る</button>
</div></div><main>
<div class="title">転生したら落ちゲーの中でした。<small>おせっかい勇者 Prototype v98</small></div>
<div class="hud"><span>STAGE <b id="stageText">1</b></span><span>連鎖P <b id="chainPoints">0</b>/<b id="goalPoints">12</b></span><span>SCORE <b id="score">0</b></span><span>必殺 <b id="specialText">0%</b></span><span id="bossHud" style="display:none">BOSS <b id="bossHpText">30</b></span><span id="bossHpGauge" style="display:inline-block;width:110px;height:9px;background:#2a2638;border-radius:8px;overflow:hidden;vertical-align:middle;margin-left:4px"><span id="bossHpBar" style="display:block;width:100%;height:100%;background:#e76565"></span></span><span id="modeText"></span><span id="modeTime"></span><button id="modeExitBtn" style="display:none">離脱</button></div>
<div class="gauge"><div id="specialBar"></div></div>
<canvas id="game" width="360" height="630"></canvas><div id="message"></div>
<div class="controls">
 <div class="dpad stick" id="moveStick"><div class="stickRing"><div class="stickKnob" id="stickKnob"></div></div></div><button id="fastFall" class="fastFall" aria-label="早送り落下">▼▼<small>早送り</small></button>
 <div class="actions"><button data-key="grab">掴</button><button data-key="jump">跳</button><button data-key="attack">剣</button><button data-key="kick" class="kick">蹴</button></div>
</div>
<p id="className">職業: -</p><p class="help">方向キー＋攻撃 / 跳 / 攻撃長押し=チャージ必殺 / 魔法使い: 剣=炎・蹴=氷・掴=風・跳=浮遊</p>
<script src="game.js?v=98"></script></main><script>
(()=>{
const cv=document.getElementById("columnsCanvas"); if(!cv)return;
const ctx=cv.getContext("2d"), C=6,R=13,S=45,OX=45,OY=22;
const colors=["#ef5c66","#55b9ff","#ffd85b","#69d783","#b46df0","#ff9b4b"];
let board,piece,score,chain,last=0,acc=0,running=false,resolving=false;
const scoreEl=document.getElementById("columnsScore"),chainEl=document.getElementById("columnsChain");
function rnd(){return colors[Math.floor(Math.random()*colors.length)]}
function reset(){board=Array.from({length:R},()=>Array(C).fill(null));score=chain=0;piece=null;resolving=false;spawn();sync()}
function spawn(){
 piece={x:2,y:0,g:[rnd(),rnd(),rnd()]};
 if(board[0][2]||board[1][2]||board[2][2]){piece=null;gameOver()}
}
function sync(){scoreEl.textContent=score;chainEl.textContent=chain}
function can(x,y){
 y=Math.floor(y);
 if(x<0||x>=C||y<0||y+2>=R)return false;
 for(let i=0;i<3;i++)if(board[y+i][x])return false;
 return true
}
function move(dx){if(!running||resolving)return;if(can(piece.x+dx,piece.y))piece.x+=dx}
function rotate(){if(!running||resolving)return;piece.g.unshift(piece.g.pop())}
function drop(){if(!running||resolving)return;while(can(piece.x,piece.y+1))piece.y++;lock()}
function lock(){
 if(!piece)return;
 let py=Math.floor(piece.y),px=piece.x,gems=piece.g.slice();
 for(let i=0;i<3;i++)board[py+i][px]=gems[i];
 piece=null;resolve(1)
}
function matches(){
 let hit=new Set(),dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){let c=board[y][x];if(!c)continue;
  for(const[dX,dY]of dirs){let cells=[[x,y]],xx=x+dX,yy=y+dY;while(xx>=0&&xx<C&&yy>=0&&yy<R&&board[yy][xx]===c){cells.push([xx,yy]);xx+=dX;yy+=dY}if(cells.length>=3)for(const[a,b]of cells)hit.add(a+","+b)}
 }return [...hit].map(s=>s.split(",").map(Number))
}
function gravity(){for(let x=0;x<C;x++){let vals=[];for(let y=R-1;y>=0;y--)if(board[y][x])vals.push(board[y][x]);for(let y=R-1,i=0;y>=0;y--)board[y][x]=i<vals.length?vals[i++]:null}}
function resolve(n){resolving=true;let m=matches();if(!m.length){chain=n-1;sync();resolving=false;spawn();return}
 chain=n;score+=m.length*10*n;sync();setTimeout(()=>{for(const[x,y]of m)board[y][x]=null;gravity();setTimeout(()=>resolve(n+1),170)},180)}
function gameOver(){running=false;setTimeout(()=>{ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 30px sans-serif";ctx.fillText("GAME OVER",180,285);ctx.font="16px sans-serif";ctx.fillText("↻ 並替ボタンで再挑戦",180,320)},20)}
function gem(x,y,c){
 let cx=OX+x*S+S/2,cy=OY+y*S+S/2,r=17;
 ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*.78,cy-r*.35);ctx.lineTo(cx+r*.88,cy+r*.55);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r*.88,cy+r*.55);ctx.lineTo(cx-r*.78,cy-r*.35);ctx.closePath();ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.42)";ctx.beginPath();ctx.moveTo(cx-7,cy-10);ctx.lineTo(cx+1,cy-13);ctx.lineTo(cx-2,cy-3);ctx.closePath();ctx.fill()
}
function draw(){
 ctx.clearRect(0,0,360,630);let g=ctx.createLinearGradient(0,0,0,630);g.addColorStop(0,"#152544");g.addColorStop(1,"#0b1222");ctx.fillStyle=g;ctx.fillRect(0,0,360,630);
 ctx.fillStyle="rgba(255,255,255,.035)";for(let y=0;y<R;y++)for(let x=0;x<C;x++)ctx.fillRect(OX+x*S+1,OY+y*S+1,S-2,S-2);
 for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board[y][x])gem(x,y,board[y][x]);
 if(piece)for(let i=0;i<3;i++)if(piece.y+i>=0)gem(piece.x,piece.y+i,piece.g[i]);
 ctx.strokeStyle="rgba(180,215,255,.35)";ctx.lineWidth=2;ctx.strokeRect(OX,OY,C*S,R*S)
}
function tick(t){if(!last)last=t;let dt=Math.min(40,t-last);last=t;if(running&&!resolving&&piece){acc+=dt;if(acc>650){acc=0;if(can(piece.x,piece.y+1))piece.y++;else lock()}}draw();requestAnimationFrame(tick)}
window.startColumns=()=>{running=true;last=0;acc=0;reset()};
if(document.getElementById("columnsScreen")?.style.display==="flex")window.startColumns();
document.querySelectorAll("[data-col]").forEach(b=>{let a=b.dataset.col;let fn=()=>{if(!running&&a==="rotate"){running=true;reset();return}if(a==="left")move(-1);if(a==="right")move(1);if(a==="rotate")rotate();if(a==="down")drop()};b.addEventListener("pointerdown",e=>{e.preventDefault();fn()})});
addEventListener("keydown",e=>{if(document.getElementById("columnsScreen").style.display==="none")return;if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key==="ArrowUp"||e.key==="x")rotate();if(e.key==="ArrowDown"||e.key===" ")drop()});
requestAnimationFrame(tick);
})();
</script>
</body></html>
