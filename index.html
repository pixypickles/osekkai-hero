<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>転生したら落ちゲーの中でした。Prototype v20</title><link rel="stylesheet" href="style.css">
</head>
<body><div id="classSelect" class="overlay"><div class="panel"><h2>職業を選択</h2>
<button data-class="hero" class="classBtn">⚔️ 勇者<small>タップで操作説明</small></button>
<button data-class="monk" class="classBtn">👊 モンク<small>タップで操作説明</small></button>
<button data-class="mage" class="classBtn">🪄 魔法使い<small>タップで操作説明</small></button>
<div id="classHelp" class="classHelp">職業をタップすると操作説明が表示されます。</div>
<button id="startBtn" class="startBtn" disabled>この職業で開始</button>
</div></div><main>
<div class="title">転生したら落ちゲーの中でした。<small>おせっかい勇者 Prototype v20</small></div>
<div class="hud"><span>連鎖P <b id="chainPoints">0</b>/<b>300</b></span><span>SCORE <b id="score">0</b></span><span>必殺 <b id="specialText">0%</b></span></div>
<div class="gauge"><div id="specialBar"></div></div>
<canvas id="game" width="360" height="630"></canvas><div id="message"></div>
<div class="controls">
 <div class="dpad">
  <button class="up" data-key="up">▲</button>
  <button class="left" data-key="left">◀</button><button class="down" data-key="down">▼</button><button class="right" data-key="right">▶</button>
 </div>
 <div class="actions"><button data-key="grab">掴</button><button data-key="jump">跳</button><button data-key="attack">剣</button><button data-key="kick" class="kick">蹴</button></div>
</div>
<p id="className">職業: -</p><p class="help">方向キー＋攻撃 / 跳 / 攻撃長押し=チャージ必殺 / 魔法使い: 剣=炎・蹴=氷・掴=風・跳=浮遊</p>
<script src="game.js"></script></main></body></html>
